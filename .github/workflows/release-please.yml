name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        options:
          - relay-client
          - relay-server
          - all

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      relay_client_release_created: ${{ steps.release.outputs['packages/relay-client--release_created'] }}
      relay_server_release_created: ${{ steps.release.outputs['packages/relay-server--release_created'] }}
    steps:
      - uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e # v2.0.6
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-relay-client:
    needs: release-please
    if: ${{ needs.release-please.outputs.relay_client_release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing (requires >= 11.5.1)
        run: npm install -g npm@latest

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - run: bunx turbo run build --filter=@pleaseai/relay-client

      - name: 'Pack with bun (resolves workspace: protocol)'
        run: bun pm pack --ignore-scripts
        working-directory: packages/relay-client

      - name: Publish tarball with npm (supports --provenance)
        run: npm publish pleaseai-relay-client-*.tgz --provenance --access public
        working-directory: packages/relay-client

  publish-relay-server:
    needs: release-please
    if: ${{ needs.release-please.outputs.relay_server_release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing (requires >= 11.5.1)
        run: npm install -g npm@latest

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: 'Pack with bun (resolves workspace: protocol)'
        run: bun pm pack --ignore-scripts
        working-directory: packages/relay-server

      - name: Publish tarball with npm (supports --provenance)
        run: npm publish pleaseai-relay-server-*.tgz --provenance --access public
        working-directory: packages/relay-server

  # Manual publish jobs (triggered via workflow_dispatch)
  manual-publish-relay-client:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.package == 'relay-client' || inputs.package == 'all') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing (requires >= 11.5.1)
        run: npm install -g npm@latest

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - run: bunx turbo run build --filter=@pleaseai/relay-client

      - name: 'Pack with bun (resolves workspace: protocol)'
        run: bun pm pack --ignore-scripts
        working-directory: packages/relay-client

      - name: Publish tarball with npm (supports --provenance)
        run: npm publish pleaseai-relay-client-*.tgz --provenance --access public
        working-directory: packages/relay-client

  manual-publish-relay-server:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.package == 'relay-server' || inputs.package == 'all') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing (requires >= 11.5.1)
        run: npm install -g npm@latest

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: 'Pack with bun (resolves workspace: protocol)'
        run: bun pm pack --ignore-scripts
        working-directory: packages/relay-server

      - name: Publish tarball with npm (supports --provenance)
        run: npm publish pleaseai-relay-server-*.tgz --provenance --access public
        working-directory: packages/relay-server
